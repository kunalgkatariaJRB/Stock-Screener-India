name: Screener CSV Sync

on:
  schedule:
    - cron: '30 19 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Download Screener CSVs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
      - name: Download CSVs
        env:
          SCREENER_SESSION: ${{ secrets.SCREENER_SESSION }}
        run: python screener_sync.py
      - name: Commit if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "Heritage Bot"
          git add data/screens/
          git diff --staged --quiet && echo "No changes" || \
          git commit -m "📊 Screener CSVs synced [skip ci]"
          git push origin main || echo "Skipped"
