name: Screener Session Health Check

# The CSV download itself now runs inside refresh.yml, so this workflow no
# longer syncs anything. Its only job is to check the Screener.in session
# cookie MIDWEEK and warn while there is still time to rotate it — the
# cookie expires every 30-45 days, and previously the first sign of trouble
# was a silently degraded Sunday run.

on:
  schedule:
    - cron: '0 6 * * 3'    # 06:00 UTC Wednesday — 4 days before the refresh
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: screener-health
  cancel-in-progress: true

jobs:
  check:
    name: Probe Screener session
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Probe one screen export
        id: probe
        env:
          SCREENER_USERNAME: ${{ secrets.SCREENER_USERNAME }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          SCREENER_SESSION: ${{ secrets.SCREENER_SESSION }}
        run: |
          python - <<'PY'
          import sys
          import screener_sync as s

          # Uses whichever auth mode is configured, exactly as the real sync does.
          opener, mode = s.authenticate()
          print(f"auth mode in use: {mode}")

          # Screen 1 (compounders) is the cheapest representative probe.
          # Download to a scratch dir so the repo is never touched here.
          import tempfile, pathlib
          s.SCREENS_DIR = pathlib.Path(tempfile.mkdtemp())
          if not s.download(opener, s.SCREEN_MAP["screen_1_compounders.csv"],
                            "screen_1_compounders.csv"):
              sys.exit("probe download failed")

          if mode == "session":
              print("::warning title=Using session cookie::This expires every "
                    "30-45 days. Setting SCREENER_USERNAME + SCREENER_PASSWORD "
                    "removes the rotation entirely.")
          print("Screener access OK")
          PY

      - name: Raise rotation issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Screener session cookie needs rotating';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'screener-session',
            });
            const body = [
              'The Screener.in session probe failed, so Sunday\'s refresh will run on **stale CSVs**.',
              '',
              `Run: ${url}`,
              '',
              'To rotate:',
              '1. Log in to screener.in in Chrome',
              '2. DevTools → Application → Cookies → screener.in',
              '3. Copy the `sessionid` value',
              '4. Settings → Secrets and variables → Actions → update `SCREENER_SESSION`',
              '',
              'Then re-run this workflow to confirm.',
            ].join('\n');
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['screener-session'],
              });
            }
