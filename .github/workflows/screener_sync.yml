name: Screener Session Health Check

# The CSV download itself now runs inside refresh.yml, so this workflow no
# longer syncs anything. Its only job is to check the Screener.in session
# cookie MIDWEEK and warn while there is still time to rotate it — the
# cookie expires every 30-45 days, and previously the first sign of trouble
# was a silently degraded Sunday run.

on:
  schedule:
    - cron: '0 6 * * 3'    # 06:00 UTC Wednesday — 4 days before the refresh
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: screener-health
  cancel-in-progress: true

jobs:
  check:
    name: Probe Screener session
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Probe one screen export
        id: probe
        env:
          SCREENER_SESSION: ${{ secrets.SCREENER_SESSION }}
        run: |
          python - <<'PY'
          import os, sys, urllib.request

          session = os.environ.get("SCREENER_SESSION", "")
          if not session:
              sys.exit("SCREENER_SESSION secret is not set")

          # Screen 1 (compounders) is the cheapest representative probe.
          url = "https://www.screener.in/screen/3695211/export/"
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)",
              "Cookie": f"sessionid={session}",
              "Referer": "https://www.screener.in/screens/",
              "Accept": "text/csv,*/*",
          })
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read()
          except Exception as e:
              sys.exit(f"probe request failed: {e}")

          if len(body) < 200:
              sys.exit(f"response only {len(body)}B — session expired")
          header = body[:400].decode("utf-8", errors="replace").split("\n")[0]
          if "Name" not in header:
              sys.exit("no 'Name' column — got a login page, session expired")
          print(f"session OK — {len(body):,}B, header: {header[:80]}")
          PY

      - name: Raise rotation issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Screener session cookie needs rotating';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'screener-session',
            });
            const body = [
              'The Screener.in session probe failed, so Sunday\'s refresh will run on **stale CSVs**.',
              '',
              `Run: ${url}`,
              '',
              'To rotate:',
              '1. Log in to screener.in in Chrome',
              '2. DevTools → Application → Cookies → screener.in',
              '3. Copy the `sessionid` value',
              '4. Settings → Secrets and variables → Actions → update `SCREENER_SESSION`',
              '',
              'Then re-run this workflow to confirm.',
            ].join('\n');
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['screener-session'],
              });
            }
