name: Refresh Heritage Ledger


on:
  schedule:
    # 02:00 UTC = 07:30 IST — runs every morning before markets open
    - cron: "0 2 * * *"→ Runs at 02:00

  workflow_dispatch:   # allows you to trigger it manually from the Actions tab


permissions:
  contents: write     # so the bot can commit data.json back to the repo


concurrency:
  group: refresh
  cancel-in-progress: false


jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25


    steps:
      - name: Check out the repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip


      - name: Install dependencies
        run: pip install --upgrade anthropic


      - name: Run the refresh script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
