name: Heritage Ledger — Daily Refresh

on:
  schedule:
    # 08:00 IST Sunday = 02:30 UTC Sunday
    - cron: '30 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # -----------------------------------------------------------------------
  # JOB 1: Process Screener CSVs → build master_universe.json
  # -----------------------------------------------------------------------
  data_ingest:
    name: Process Screener CSVs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Run data ingest
        run: |
          mkdir -p data/processed
          python data_ingest.py

      - name: Commit processed universe
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "Heritage Bot"
          git add data/processed/ || true
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "📊 Universe updated [skip ci]"
          git push origin main || echo "Push skipped"

  # -----------------------------------------------------------------------
  # JOB 2: Daily Claude Analysis
  # -----------------------------------------------------------------------
  daily_refresh:
    name: Daily Claude Refresh
    runs-on: ubuntu-latest
    needs: data_ingest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run Heritage Ledger refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HERITAGE_MODEL: claude-sonnet-5
        run: python refresh.py

      - name: Commit updated data.json
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "Heritage Bot"
          git add data.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "🤖 Daily refresh: $(date -u +'%Y-%m-%d') [skip ci]"
          git push origin main || echo "Push skipped"
