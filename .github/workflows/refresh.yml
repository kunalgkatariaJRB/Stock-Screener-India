name: Refresh Heritage Ledger

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade anthropic

      - name: Run the refresh script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HERITAGE_MODEL: "claude-sonnet-4-6"
        run: python refresh.py

      - name: Commit and push if data.json changed
        run: |
          git config --local user.name  "Heritage Ledger Bot"
          git config --local user.email "bot@heritageledger.local"
          git add data.json
          if git diff --quiet --staged; then
            echo "No changes to commit today."
          else
            git commit -m "Daily refresh: $(date -u +%Y-%m-%d) [skip ci]"
            git push
            echo "Pushed updated data.json"
          fi
