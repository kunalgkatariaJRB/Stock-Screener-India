name: Heritage Ledger — Weekly Refresh

# Runs 08:00 IST Sunday. The whole pipeline is ONE job so that ingest and
# refresh cannot disagree about which universe is current, and so there is
# exactly one push per run (the old two-job layout raced on main and
# swallowed non-fast-forward rejections with `|| echo "Push skipped"`).
#
# To move back to daily, swap the cron below for '30 2 * * *'.

on:
  schedule:
    - cron: '30 2 * * 0'   # 02:30 UTC Sunday = 08:00 IST Sunday
  workflow_dispatch:
    inputs:
      skip_sync:
        description: 'Skip the Screener CSV download (use committed CSVs)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write            # needed to raise a failure issue

# Never let two runs fight over data.json.
concurrency:
  group: heritage-refresh
  cancel-in-progress: false

jobs:
  pipeline:
    name: Sync → Ingest → Analyse → Publish
    runs-on: ubuntu-latest
    timeout-minutes: 90     # refresh.py makes ~180 HTTP calls + ~30 Claude calls

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ---------------------------------------------------------------
      # 1. Screener CSVs. Optional: if the session cookie has expired we
      #    still run on the committed CSVs, but the run must SAY SO.
      # ---------------------------------------------------------------
      - name: Sync Screener CSVs
        id: sync
        if: ${{ !inputs.skip_sync }}
        continue-on-error: true
        env:
          # Preferred: fully unattended, nothing expires.
          SCREENER_USERNAME: ${{ secrets.SCREENER_USERNAME }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          # Fallback: used only if the two above are unset.
          SCREENER_SESSION: ${{ secrets.SCREENER_SESSION }}
        run: |
          set -o pipefail
          python screener_sync.py 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"

      - name: Flag stale CSVs
        if: ${{ steps.sync.outcome == 'failure' }}
        run: |
          echo "::warning title=Screener sync failed::Running on committed CSVs. Rotate SCREENER_SESSION in Settings → Secrets → Actions."

      # ---------------------------------------------------------------
      # 2. Build the universe. Hard-fails on a missing screen, a zero-stock
      #    universe, an empty tier, or two CSVs colliding on one screen.
      # ---------------------------------------------------------------
      - name: Build universe
        run: |
          mkdir -p data/processed
          python data_ingest.py

      - name: Verify universe integrity
        run: |
          python - <<'PY'
          import json, sys
          u = json.load(open('data/processed/master_universe.json'))
          stats = u['stats']
          total = stats['total']
          print(f"universe total = {total}")
          print(json.dumps(stats, indent=2))
          if total < 50:
              sys.exit(f"FATAL: universe has only {total} stocks — expected 300+. "
                       "Screens are missing or malformed.")
          empty = [k for k, v in u['universe'].items() if not v]
          if empty:
              sys.exit(f"FATAL: empty tier(s): {empty}")
          if stats['unresolved_symbols'] > total * 0.1:
              sys.exit(f"FATAL: {stats['unresolved_symbols']}/{total} symbols "
                       "unresolved — NSE/BSE codes missing from the exports.")
          print("universe OK")
          PY

      # ---------------------------------------------------------------
      # 3. Claude analysis. Exits non-zero on any dropped tier batch.
      # ---------------------------------------------------------------
      - name: Generate verdicts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HERITAGE_MODEL: claude-sonnet-5
        run: |
          set -o pipefail
          python refresh.py 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"

      - name: Verify published data is fresh
        run: |
          python - <<'PY'
          import json, sys, datetime as dt
          d = json.load(open('data.json'))
          ts = dt.datetime.fromisoformat(d['lastUpdated'])
          age_h = (dt.datetime.now(ts.tzinfo) - ts).total_seconds() / 3600
          print(f"data.json lastUpdated = {d['lastUpdated']} ({age_h:.1f}h old)")
          if age_h > 24:
              sys.exit(f"FATAL: data.json is {age_h:.0f}h old — refresh did not "
                       "write. This is the failure that went unnoticed for months.")
          vetted = sum(len(v) for k, v in d.get('tiers', {}).items()
                       if isinstance(v, list))
          print(f"universe stocks vetted = {vetted}")
          if vetted < 200:
              sys.exit(f"FATAL: only {vetted} verdicts — expected 300+. "
                       "Tier batches were dropped.")
          ledger = {k: len(v) for k, v in d.get('stocks', {}).items()}
          print("ledger buckets =", ledger)
          if not ledger.get('conviction'):
              sys.exit("FATAL: conviction bucket is empty.")
          print("data.json OK")
          PY

      # ---------------------------------------------------------------
      # 4. Publish. Rebase-and-retry instead of swallowing a rejected push.
      # ---------------------------------------------------------------
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "Heritage Bot"
          git add data.json data/processed/ data/screens/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Weekly refresh: $(date -u +'%Y-%m-%d') [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — rebasing (attempt $attempt)"
            git pull --rebase origin main
          done
          echo "::error title=Push failed::Could not push after 3 attempts."
          exit 1

      # ---------------------------------------------------------------
      # 5. Tell a human, and tell them WHAT broke. Actions logs require
      #    sign-in, so the diagnosis has to travel in the issue itself.
      # ---------------------------------------------------------------
      - name: Collect failure diagnostics
        if: failure()
        id: diag
        env:
          # Passed in so they can be scrubbed out of the excerpt. GitHub masks
          # secrets in logs, but NOT in an issue body we create ourselves.
          S1: ${{ secrets.SCREENER_PASSWORD }}
          S2: ${{ secrets.SCREENER_SESSION }}
          S3: ${{ secrets.ANTHROPIC_API_KEY }}
          S4: ${{ secrets.SCREENER_USERNAME }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/excerpt.txt"
          import os, re, pathlib

          log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pipeline.log"
          text = log.read_text(errors="replace") if log.exists() else ""

          # Scrub every secret value before this text leaves the runner.
          for var in ("S1", "S2", "S3", "S4"):
              val = os.environ.get(var, "")
              if val and len(val) > 3:
                  text = text.replace(val, "***REDACTED***")
          # Belt and braces: anything that looks like an API key.
          text = re.sub(r"sk-[A-Za-z0-9_\-]{12,}", "***REDACTED***", text)

          lines = text.splitlines()
          # Prefer the lines that actually explain the failure.
          signal = [l for l in lines if re.search(
              r"FAILURE|FATAL|Traceback|Error|error|\u2717|^\s*!|exit code", l)]
          chosen = signal[-40:] if signal else lines[-40:]
          print("\n".join(chosen) if chosen else "(no output captured)")
          PY
          echo "captured $(wc -l < "$RUNNER_TEMP/excerpt.txt") line(s)"

      - name: Raise failure issue
        if: failure()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            let excerpt = '(no diagnostics captured)';
            try {
              excerpt = fs.readFileSync(`${process.env.RUNNER_TEMP}/excerpt.txt`, 'utf8').trim()
                        || excerpt;
            } catch (e) { /* diagnostics step may not have run */ }
            if (excerpt.length > 8000) excerpt = excerpt.slice(-8000);

            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Heritage Ledger refresh failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'pipeline-failure',
            });
            const body = [
              'The weekly refresh failed.',
              '',
              `Run: ${url}`,
              `Commit: ${context.sha}`,
              '',
              'The dashboard is now serving **stale verdicts**.',
              '',
              '<details><summary>Failure output (secrets redacted)</summary>',
              '',
              '```',
              excerpt,
              '```',
              '',
              '</details>',
            ].join('\n');
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['pipeline-failure'],
              });
            }
